name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # weekly: catches breakage from new NumPy/SciPy/Numba releases

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy numpy scipy
      - run: ruff check flowtrace tests
      - run: mypy

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # actions/setup-python has no Python 3.9 (end of life since October 2025) for
          # ubuntu-latest = Ubuntu 26.04, so that cell failed in setup and the jobs that need
          # the matrix (package, benchmarks-quick) never ran; Ubuntu 24.04 still has 3.9.25
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[cpu,amg,h5,report]" pytest pytest-cov
      - name: What was detected (native C++ kernels need g++/clang++ on the PATH)
        run: python -m flowtrace probe
      - name: Test (GPU paths run against the NumPy-backed CuPy stand-in)
        run: python -m pytest -q --cov=flowtrace --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  test-reference-path:
    # the NumPy/SciPy path stays the reference: run everything once without the native kernels
    needs: lint
    runs-on: ubuntu-latest
    env:
      FLOWTRACE_NO_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[cpu,amg,h5,report]" pytest
      - run: python -m pytest -q

  fluent-files:
    # readers and writers against files written by Ansys Fluent itself: the PyFluent mixing-elbow
    # example (ansys/example-data, MIT licence, ~9 MB, SHA-256 checked), fetched at run time
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[h5]" pytest
      - run: python benchmarks/fluent_files_check.py
      - run: python -m pytest -q tests/test_fluent_files.py

  benchmarks-quick:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[cpu,amg,report]"
      - name: Verification suite (MMS, exact solutions, Ghia, de Vahl Davis, DNS channel, CHT, MRF)
        run: python -m flowtrace benchmark --tier quick --out bench-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: bench-out

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
